name: ci

on:
  push:
  pull_request:

jobs:
  build-and-boot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install nasm, qemu, ffmpeg, numpy, pillow
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm qemu-system-x86 ffmpeg
          pip install -r requirements.txt
      - name: rebuild from source
        run: |
          python3 build.py
          python3 demo/anatomy.py
      - name: the committed image and figure are exactly what the source builds
        run: git diff --exit-code -- fixpoint.bmp stub.asm anatomy.svg
      - name: check every claim (decoders, disk, archive) and boot it
        run: python3 verify.py
