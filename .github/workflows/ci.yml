name: ci

on:
  push:
  pull_request:

jobs:
  build-and-boot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install nasm, qemu, pillow
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm qemu-system-x86
          pip install -r requirements.txt
      - name: rebuild from source
        run: python3 build.py
      - name: the committed image is exactly what the source builds
        run: git diff --exit-code -- fixpoint.bmp stub.asm
      - name: boot it and compare the screen to the image
        run: python3 verify.py
