<rect width="100%" height="100%" rx="10" fill="#0d1117"/>
<text x="56" y="44" fill="#f0f6fc" font-size="17" font-weight="700">the boot sector, as the cpu reads it</text>
<text x="56" y="68" fill="#8b949e" font-size="12.5">the first 512 bytes of fixpoint.bmp: the header, then palette entries 00 to 72, four bytes each (blue, green, red, unused).</text>
<text x="56" y="86" fill="#8b949e" font-size="12.5">the thread is the path the cpu takes, traced from the file by disassembling it.</text>
<text x="56" y="122" fill="#8b949e" font-size="11">header, bytes 0–53</text>
